apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-deployment
  namespace: default

spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask

  template:
    metadata:
      labels:
        app: flask

    spec:
      containers:
      - name: flask-container
        image: iritkigelman/flask-cicd:1.0
        ports:
        - containerPort: 5000
